name: SimpleSlides
options:
  bundleIdPrefix: com.malverma
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SimpleSlides:
    type: application
    platform: iOS
    scheme:
      testTargets: [SimpleSlidesUITests]
    sources:
      - path: SimpleSlides
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malverma.simpleslides
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SimpleSlides/Info.plist
        ENABLE_PREVIEWS: YES
    info:
      path: SimpleSlides/Info.plist
      properties:
        CFBundleDisplayName: SimpleSlides
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.malverma.simpleslides.deck
            UTTypeDescription: SimpleSlides Deck
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [simpleslides]
        CFBundleDocumentTypes:
          - CFBundleTypeName: SimpleSlides Deck
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.malverma.simpleslides.deck]
  SimpleSlidesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SimpleSlidesUITests
    dependencies:
      - target: SimpleSlides
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.malverma.simpleslides.uitests
